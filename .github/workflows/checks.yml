name: JobPath checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  smoke-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Use npm install while package.json and package-lock.json are being reconciled.
      - name: Install dependencies
        run: npm install

      - name: Run project smoke checks
        run: npm run check
