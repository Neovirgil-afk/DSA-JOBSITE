<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Administration — JobSite</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/style.css"><style>
.admin-page{min-height:100vh;padding:35px 0 70px;background:var(--cream)}.admin-wrap{width:min(1120px,calc(100% - 32px));margin:auto}.admin-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:22px}.admin-head h1{font-size:clamp(28px,4vw,40px);color:var(--navy);margin-top:8px}.admin-head p{font-size:12px;color:var(--muted);margin-top:8px}.admin-kicker{font-size:10px;font-weight:800;letter-spacing:.13em;color:var(--indigo)}.admin-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.admin-card,.admin-panel{background:#fff;border:1px solid var(--line);border-radius:15px;padding:17px;box-shadow:var(--shadow-card);min-width:0}.admin-card span{display:block;font-size:10px;color:var(--muted);font-weight:700}.admin-card strong{display:block;margin-top:7px;font:800 27px Poppins,sans-serif;color:var(--navy)}.admin-panels{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.admin-panel h2{font-size:16px;color:var(--navy);margin-bottom:12px}.admin-table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:11px}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}th{font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}.admin-status{display:inline-block;border-radius:999px;background:#f1f0f8;padding:5px 8px;font-size:10px}.admin-select{border:1px solid var(--line);border-radius:8px;padding:6px;background:#fff;font:11px Inter,sans-serif}.admin-message{padding:14px;border:1px dashed var(--line);border-radius:12px;font-size:12px;line-height:1.6;color:var(--muted)}.admin-error{color:#b42318}.admin-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.admin-refresh{border:0;border-radius:999px;background:var(--indigo);color:white;padding:10px 14px;font-size:11px;font-weight:800}@media(max-width:700px){.admin-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.admin-panels{grid-template-columns:1fr}.admin-head{align-items:flex-start;flex-direction:column}}
</style></head><body><header class="site-header"><div class="wrap header-inner"><a class="logo" href="/"><span class="logo-text">JOB<span class="logo-accent">SITE</span></span></a><nav class="main-nav" aria-label="Primary"><a href="/">Find Jobs</a><a href="/career-center.html">Career Center</a><a href="/employer.html">Employer Area</a></nav><div class="header-actions"><a class="btn btn-primary" href="/">Back to JobSite</a></div></div></header><main class="admin-page"><div class="admin-wrap"><div class="admin-head"><div><span class="admin-kicker">PLATFORM CONTROL</span><h1>Admin Dashboard</h1><p>Monitor platform activity and manage listing visibility.</p></div><button class="admin-refresh" id="adminRefresh" type="button">Refresh overview ↻</button></div><div id="adminNotice" class="admin-message">Checking administrator access…</div><section id="adminContent" hidden><div id="adminStats" class="admin-grid"></div><div class="admin-panels"><section class="admin-panel"><h2>Recent users</h2><div class="admin-table-wrap" id="adminUsers"></div></section><section class="admin-panel"><h2>Recent job listings</h2><div class="admin-table-wrap" id="adminJobs"></div></section><section class="admin-panel" style="grid-column:1/-1"><h2>Recent applications</h2><div class="admin-table-wrap" id="adminApplications"></div></section></div></section></div></main><script src="/js/admin.js" defer></script>    <script src="/js/floating-hub.js" defer></script>
</body></html>
