<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JobSite — My Applications</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="applications-page">
<header class="site-header">
  <div class="wrap header-inner">
    <a class="logo" href="/">
      <span class="logo-text">JOB<span class="logo-accent">SITE</span></span>
      <svg class="logo-plane" width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M21.5 2.5L2 10.2c-.8.3-.8 1.4 0 1.7l7.6 2.9 2.9 7.6c.3.8 1.4 1.4 1.7 0L21.9 3.9c-.3-.9-.6-1.7-1.4-1.4z" fill="currentColor"/></svg>
    </a>
    <nav class="main-nav" aria-label="Primary">
      <a href="/">Find Jobs</a>
      <a href="/applications.html" class="active">My Applications</a>
      <a href="/profile.html" data-mobile-route="/profile.html">Profile</a>
    </nav>
    <div class="header-actions"><a href="/" class="btn btn-primary">Find Jobs</a></div>
  </div>
</header>

<div class="mobile-page-shell-header">
  <a href="/" class="mobile-page-brand" aria-label="JobSite home"><svg class="mobile-brand-plane-only" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M21.5 2.5L2 10.2c-.8.3-.8 1.4 0 1.7l7.6 2.9 2.9 7.6c.3.8 1.4 0 1.7 0L21.9 3.9c-.3-.9-.6-1.7-1.4-1.4z" fill="currentColor"/></svg></a>
  <div class="mobile-page-title"><span>JOBSITE</span><strong>My Applications</strong></div>
  <a href="/profile.html" class="mobile-page-header-action" aria-label="Open profile">●</a>
</div>
<main class="applications-main">
  <div class="wrap">
    <div class="applications-heading">
      <div>
        <span class="eyebrow">JOB SEEKER</span>
        <h1>My Applications</h1>
        <p>Track the jobs you've applied for and see their latest status.</p>
      </div>
      <a class="btn btn-primary" href="/">Browse Jobs</a>
    </div>

    <div class="application-summary" id="applicationSummary">
      <strong id="applicationCount">0</strong>
      <span>Total applications</span>
    </div>

    <section class="applications-list" id="applicationsList" aria-live="polite">
      <div class="applications-loading">Loading your applications...</div>
    </section>
  </div>
</main>

<nav class="mobile-page-bottom-nav" aria-label="Mobile navigation">
  <a href="/"><span>⌂</span><small>Home</small></a>
  <a href="/#resultsSection"><span>⌕</span><small>Jobs</small></a>
  <a href="/learning.html" data-mobile-route="/learning.html"><span>↗</span><small>Learn</small></a>
  <a href="/profile.html"><span>●</span><small>Profile</small></a>
</nav>

<script src="/js/auth.js"></script>
<script src="/js/applications.js"></script>
</body>
</html>
